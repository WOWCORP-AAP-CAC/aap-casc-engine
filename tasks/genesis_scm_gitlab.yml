---
# genesis_scm_gitlab.yml — GitLab-specific SCM operations for platform genesis
#
# Creates the control repository plus platform desired-state repositories.
# Control files are never written to desired-state repositories.
#
# ROADMAP-004: managed scaffold content is published via ordinary-Git atomic
# commits (scripts/pipeline/scaffold_commit.py) — zero or one commit per
# (repository, branch) operation.
#
# Required variables: control_scm_org, control_repo, control_branch, genesis_repos,
#   platform_repos, scm_api_token, platform_scm_org, repo_visibility,
#   _config_yml_content, _tenants_yml_content
# For repo_mode=create, namespace IDs are resolved internally from SCM org paths.

# ═══════════════════════════════════════════════════════════════════════════
# Step 0: Resolve GitLab group IDs (create-mode only; fail before mutation)
# ═══════════════════════════════════════════════════════════════════════════

- name: "GL – Resolve control group namespace ID"
  ansible.builtin.include_tasks: gitlab_resolve_group.yml
  vars:
    gitlab_group_full_path: "{{ control_scm_org }}"
  when: repo_mode == 'create'

- name: "GL – Store control namespace ID"
  ansible.builtin.set_fact:
    _gl_control_namespace_id: "{{ gitlab_resolved_namespace_id }}"
  when: repo_mode == 'create'

- name: "GL – Resolve platform group namespace ID"
  ansible.builtin.include_tasks: gitlab_resolve_group.yml
  vars:
    gitlab_group_full_path: "{{ platform_scm_org }}"
  when:
    - repo_mode == 'create'
    - platform_scm_org != control_scm_org

- name: "GL – Store platform namespace ID (same group as control when paths match)"
  ansible.builtin.set_fact:
    _gl_platform_namespace_id: "{{ _gl_control_namespace_id if platform_scm_org == control_scm_org else gitlab_resolved_namespace_id }}"
  when: repo_mode == 'create'

# ═══════════════════════════════════════════════════════════════════════════
# Step 1: Create all platform repos (tolerates already-exists)
# ═══════════════════════════════════════════════════════════════════════════

- name: "GL – Create or verify control and platform repositories"
  ansible.builtin.uri:
    url: "{{ scm_base_url }}/api/v4/projects"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ scm_api_token }}"
    body_format: json
    body:
      name: "{{ item.name }}"
      description: "{{ item.description }}"
      namespace_id: "{{ _gl_control_namespace_id if item.repository_class == 'control' else _gl_platform_namespace_id }}"
      visibility: "{{ repo_visibility }}"
      initialize_with_readme: false
    status_code: [200, 201, 400]
  failed_when: >-
    _gl_repo_result.status == 400 and
    'has already been taken' not in (_gl_repo_result.json | default({}) | string)
  register: _gl_repo_result
  loop: "{{ genesis_repos }}"
  loop_control:
    label: "{{ item.name }}@{{ _gl_control_namespace_id if item.repository_class == 'control' else _gl_platform_namespace_id }}"
  when: repo_mode == 'create'

- name: "GL – Look up project IDs"
  ansible.builtin.uri:
    url: "{{ scm_base_url }}/api/v4/projects/{{ ((control_scm_org if item.repository_class == 'control' else platform_scm_org) ~ '/' ~ item.name) | urlencode() | replace('/', '%2F') }}"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ scm_api_token }}"
  loop: "{{ genesis_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: _gl_project_lookups

- name: "GL – Find control repo project ID"
  ansible.builtin.set_fact:
    _gl_control_project_id: >-
      {{ (_gl_project_lookups.results | selectattr('item.name', 'equalto', control_repo) | first).json.id }}

- name: "GL – Store control repo default branch"
  ansible.builtin.set_fact:
    _gl_control_default_branch: >-
      {{ (_gl_project_lookups.results | selectattr('item.name', 'equalto', control_repo) | first).json.default_branch | default('main', true) }}

- name: "GL – Store combined platform desired-state project ID"
  ansible.builtin.set_fact:
    _gl_platform_combined_project_id: >-
      {{ (_gl_project_lookups.results | selectattr('item.name', 'equalto', platform_repo) | first).json.id }}

- name: "GL – Verify every mapped desired-state branch before existing-repo mutation"
  ansible.builtin.uri:
    url: "{{ scm_base_url }}/api/v4/projects/{{ item.0.json.id }}/repository/branches/{{ item.1 | urlencode | replace('/', '%2F') }}"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ scm_api_token }}"
    status_code: [200, 404, 409]
  loop: >-
    {{ (_gl_project_lookups.results | selectattr('item.repository_class', 'equalto', 'platform') | list)
       | product(env_branch_map.values() | list) | list }}
  loop_control:
    label: "{{ item.0.item.name }}:{{ item.1 }}"
  register: _gl_existing_branch_checks
  when: not (create_missing_env_branches | bool)

- name: "GL – Fail existing-repository Genesis before scaffolding when branches are missing"
  ansible.builtin.assert:
    that:
      - _gl_existing_branch_checks.results | rejectattr('status', 'equalto', 200) | list | length == 0
    fail_msg: "repo_mode=existing with create_missing_env_branches=false requires every mapped branch in every platform desired-state repository."
  when: not (create_missing_env_branches | bool)

- name: "GL - Index empty control repositories for Option A first commit"
  ansible.builtin.set_fact:
    _gl_empty_control_repos: "{{ _gl_empty_control_repos | default([]) + [item.item.name] }}"
  loop: "{{ _gl_project_lookups.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.json.empty_repo | default(false) | bool
    - item.item.repository_class == 'control'

- name: "GL - Index empty platform repositories for Option A first commit"
  ansible.builtin.set_fact:
    _gl_empty_platform_repos: "{{ _gl_empty_platform_repos | default([]) + [item.item.name] }}"
  loop: "{{ _gl_project_lookups.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.json.empty_repo | default(false) | bool
    - item.item.repository_class != 'control'

# ═══════════════════════════════════════════════════════════════════════════
# Step 2: Build atomic manifests
# ═══════════════════════════════════════════════════════════════════════════

- name: "GL – Compute all folder paths (combined)"
  ansible.builtin.set_fact:
    _genesis_seed_paths: >-
      {{ (_platform_type_folders | map('regex_replace', '^', 'base/') | list)
         + (env_branch_map.keys() | list | product(_platform_type_folders)
            | map('join', '/') | list) }}

- name: "GL - Initialize platform branch scaffold inventory"
  ansible.builtin.set_fact:
    _platform_branch_scaffold: []

- name: "GL - Add combined folder scaffolds"
  ansible.builtin.set_fact:
    _platform_branch_scaffold: >-
      {{ _platform_branch_scaffold
         + [{'repo': platform_repo, 'path': item + '/.gitkeep', 'content': ''}] }}
  loop: "{{ _genesis_seed_paths | default([]) }}"

- name: "GL - Add combined examples"
  ansible.builtin.set_fact:
    _platform_branch_scaffold: >-
      {{ _platform_branch_scaffold
         + [{'repo': platform_repo,
             'path': 'base/' + item.folder + '/example.yml.sample',
             'content': lookup('template', item.template)}] }}
  loop: "{{ _platform_type_metadata }}"

- name: "GL - Build control atomic manifest"
  ansible.builtin.set_fact:
    _control_scaffold_manifest: >-
      {{
        [{'path': 'config.yml', 'content': _config_yml_content, 'policy': 'create_only'},
         {'path': 'tenants.yml', 'content': _tenants_yml_content, 'policy': 'create_only'},
         {'path': 'naming-rules.yml.sample', 'content': _naming_rules_sample_content, 'policy': 'create_only'},
         {'path': 'README.md',
          'content': lookup('template', 'templates/genesis-readme.md.j2'),
          'policy': 'create_only'},
         {'path': '.gitlab-ci.yml',
          'content': lookup('template', 'templates/gitlab-ci-caller.yml.j2'),
          'policy': 'converge'}]
      }}
  vars:
    caller_role: control
    repo: "{{ genesis_repos | selectattr('repository_class', 'equalto', 'control') | first }}"

- name: "GL - Build platform atomic manifest"
  ansible.builtin.set_fact:
    _platform_scaffold_manifest: >-
      {{
        [{'path': 'README.md',
          'content': lookup('template', 'templates/genesis-readme.md.j2'),
          'policy': 'create_only'},
         {'path': '.gitlab-ci.yml',
          'content': lookup('template', 'templates/gitlab-ci-caller.yml.j2'),
          'policy': 'converge'}]
        + (_platform_branch_scaffold
           | map('combine', {'policy': 'create_only'})
           | list)
      }}
  vars:
    caller_role: platform
    repo: "{{ genesis_repos | rejectattr('repository_class', 'equalto', 'control') | first }}"

# ═══════════════════════════════════════════════════════════════════════════
# Step 3: Option A — full first commit for empty repos
# ═══════════════════════════════════════════════════════════════════════════

- name: "GL - Initialize empty control repository with full atomic scaffold"
  ansible.builtin.include_tasks: run_scaffold_commit.yml
  vars:
    scaffold_repo_url: "{{ scm_base_url }}/{{ control_scm_org }}/{{ item }}.git"
    scaffold_repo_display: "{{ control_scm_org }}/{{ item }}"
    scaffold_branch: "{{ control_branch }}"
    scaffold_provider: gitlab
    scaffold_commit_message: "Genesis: publish control scaffold [skip ci]"
    scaffold_manifest_entries: "{{ _control_scaffold_manifest }}"
  loop: "{{ _gl_empty_control_repos | default([]) }}"
  loop_control:
    label: "{{ item }}@{{ control_branch }}"

- name: "GL - Initialize empty platform repositories with full atomic scaffold"
  ansible.builtin.include_tasks: run_scaffold_commit.yml
  vars:
    scaffold_repo_url: "{{ scm_base_url }}/{{ platform_scm_org }}/{{ item }}.git"
    scaffold_repo_display: "{{ platform_scm_org }}/{{ item }}"
    scaffold_branch: "{{ _desired_state_seed_branch }}"
    scaffold_provider: gitlab
    scaffold_commit_message: "Genesis: publish platform scaffold [skip ci]"
    scaffold_manifest_entries: "{{ _platform_scaffold_manifest }}"
  loop: "{{ _gl_empty_platform_repos | default([]) }}"
  loop_control:
    label: "{{ item }}@{{ _desired_state_seed_branch }}"
  when: create_missing_env_branches | bool

- name: "GL – Refresh project lookups after Option A init"
  ansible.builtin.uri:
    url: "{{ scm_base_url }}/api/v4/projects/{{ ((control_scm_org if item.repository_class == 'control' else platform_scm_org) ~ '/' ~ item.name) | urlencode() | replace('/', '%2F') }}"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ scm_api_token }}"
  loop: "{{ genesis_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: _gl_project_lookups

- name: "GL – Refresh control and platform project IDs"
  ansible.builtin.set_fact:
    _gl_control_project_id: >-
      {{ (_gl_project_lookups.results | selectattr('item.name', 'equalto', control_repo) | first).json.id }}
    _gl_control_default_branch: >-
      {{ (_gl_project_lookups.results | selectattr('item.name', 'equalto', control_repo) | first).json.default_branch | default('main', true) }}
    _gl_platform_combined_project_id: >-
      {{ (_gl_project_lookups.results | selectattr('item.name', 'equalto', platform_repo) | first).json.id }}

# ═══════════════════════════════════════════════════════════════════════════
# Step 4: Ensure branch topology
# ═══════════════════════════════════════════════════════════════════════════

- name: "GL – Create control branch when it differs from its default branch"
  when:
    - control_repo not in (_gl_empty_control_repos | default([]))
    - control_branch != _gl_control_default_branch
  block:
    - name: "GL – Create control branch from default branch"
      ansible.builtin.uri:
        url: "{{ scm_base_url }}/api/v4/projects/{{ _gl_control_project_id }}/repository/branches"
        method: POST
        headers:
          PRIVATE-TOKEN: "{{ scm_api_token }}"
        body_format: json
        body:
          branch: "{{ control_branch }}"
          ref: "{{ _gl_control_default_branch }}"
        status_code: [200, 201, 400]
      failed_when: >-
        _gl_control_branch_result.status == 400 and
        'already exists' not in (_gl_control_branch_result.json.message | default('') | lower)
      register: _gl_control_branch_result

- name: "GL – Ensure highest environment branch exists for non-empty platform projects"
  ansible.builtin.uri:
    url: "{{ scm_base_url }}/api/v4/projects/{{ item.json.id }}/repository/branches"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ scm_api_token }}"
    body_format: json
    body:
      branch: "{{ _desired_state_seed_branch }}"
      ref: "{{ item.json.default_branch }}"
    status_code: [200, 201, 400]
  failed_when: >-
    _gl_seed_branch_result.status == 400 and
    'already exists' not in (_gl_seed_branch_result.json.message | default('') | lower)
  loop: "{{ _gl_project_lookups.results | selectattr('item.repository_class', 'equalto', 'platform') | list }}"
  register: _gl_seed_branch_result
  when:
    - create_missing_env_branches | bool
    - item.item.name not in (_gl_empty_platform_repos | default([]))
    - item.json.default_branch != _desired_state_seed_branch

- name: "GL – Compute lower environment branches in promotion order"
  ansible.builtin.set_fact:
    _lower_env_branches: "{{ (env_branch_map.values() | list | reverse | list)[1:] }}"

- name: "GL – Create missing lower environment branches from seeded high branch"
  ansible.builtin.uri:
    url: "{{ scm_base_url }}/api/v4/projects/{{ item.0.json.id }}/repository/branches"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ scm_api_token }}"
    body_format: json
    body:
      branch: "{{ item.1 }}"
      ref: "{{ _desired_state_seed_branch }}"
    status_code: [200, 201, 400]
  failed_when: >-
    _gl_lower_branch_result.status == 400 and
    'already exists' not in (_gl_lower_branch_result.json.message | default('') | lower)
  loop: >-
    {{ (_gl_project_lookups.results | selectattr('item.repository_class', 'equalto', 'platform') | list)
       | product(_lower_env_branches) | list }}
  register: _gl_lower_branch_result
  when: create_missing_env_branches | bool

# ═══════════════════════════════════════════════════════════════════════════
# Step 5: Atomic scaffold publish
# ═══════════════════════════════════════════════════════════════════════════

- name: "GL - Publish atomic control scaffold on control_branch only"
  ansible.builtin.include_tasks: run_scaffold_commit.yml
  vars:
    scaffold_repo_url: "{{ scm_base_url }}/{{ control_scm_org }}/{{ control_repo }}.git"
    scaffold_repo_display: "{{ control_scm_org }}/{{ control_repo }}"
    scaffold_branch: "{{ control_branch }}"
    scaffold_provider: gitlab
    scaffold_commit_message: "Genesis: publish control scaffold [skip ci]"
    scaffold_manifest_entries: "{{ _control_scaffold_manifest }}"

- name: "GL - Converge platform scaffold on every mapped branch"
  ansible.builtin.include_tasks: run_scaffold_commit.yml
  vars:
    scaffold_repo_url: "{{ scm_base_url }}/{{ platform_scm_org }}/{{ item.0.name }}.git"
    scaffold_repo_display: "{{ platform_scm_org }}/{{ item.0.name }}"
    scaffold_branch: "{{ item.1 }}"
    scaffold_provider: gitlab
    scaffold_commit_message: "Genesis: publish platform scaffold [skip ci]"
    scaffold_manifest_entries: "{{ _platform_scaffold_manifest }}"
  loop: "{{ platform_repos | product(env_branch_map.values() | list) | list }}"
  loop_control:
    label: "{{ item.0.name }}@{{ item.1 }}"

# ═══════════════════════════════════════════════════════════════════════════
# Step 6: Genesis verify parity (policy-aware)
# ═══════════════════════════════════════════════════════════════════════════

- name: "GL - Verify final control scaffold paths exist"
  ansible.builtin.uri:
    url: "{{ scm_base_url }}/api/v4/projects/{{ _gl_control_project_id }}/repository/files/{{ item.path | urlencode() | replace('/', '%2F') }}?ref={{ control_branch | urlencode }}"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ scm_api_token }}"
  loop: "{{ _control_scaffold_manifest }}"
  loop_control:
    label: "{{ control_repo }}@{{ control_branch }}:{{ item.path }}"
  register: _gl_final_control_checks

- name: "GL - Assert final control converge content"
  ansible.builtin.assert:
    that:
      - (item.json.content | b64decode) == item.item.content
    fail_msg: >-
      Control converge path mismatch for
      {{ control_repo }}@{{ control_branch }}:{{ item.item.path }}.
  loop: "{{ _gl_final_control_checks.results }}"
  when: item.item.policy == 'converge'

- name: "GL - Verify platform thin callers on every mapped branch"
  ansible.builtin.uri:
    url: "{{ scm_base_url }}/api/v4/projects/{{ _gl_platform_combined_project_id }}/repository/files/{{ '.gitlab-ci.yml' | urlencode() | replace('/', '%2F') }}?ref={{ item.1 | urlencode }}"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ scm_api_token }}"
  loop: "{{ platform_repos | product(env_branch_map.values() | list) | list }}"
  register: _gl_final_platform_caller_checks

- name: "GL - Assert platform thin callers match the engine template"
  ansible.builtin.assert:
    that:
      - (item.json.content | b64decode) == _platform_caller_content
    fail_msg: "Platform thin caller convergence failed for {{ item.item.0.name }}@{{ item.item.1 }}."
  vars:
    caller_role: platform
    _platform_caller_content: "{{ lookup('template', 'templates/gitlab-ci-caller.yml.j2') }}"
  loop: "{{ _gl_final_platform_caller_checks.results }}"

- name: "GL - Verify required platform scaffold files exist on every mapped branch"
  ansible.builtin.uri:
    url: "{{ scm_base_url }}/api/v4/projects/{{ _gl_platform_combined_project_id }}/repository/files/{{ item.0.path | urlencode() | replace('/', '%2F') }}?ref={{ item.1 | urlencode }}"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ scm_api_token }}"
  loop: "{{ _platform_branch_scaffold | product(env_branch_map.values() | list) | list }}"
  loop_control:
    label: "{{ item.0.repo }}@{{ item.1 }}:{{ item.0.path }}"

- name: "GL - Verify platform README exists on every mapped branch"
  ansible.builtin.uri:
    url: "{{ scm_base_url }}/api/v4/projects/{{ _gl_platform_combined_project_id }}/repository/files/README.md?ref={{ item.1 | urlencode }}"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ scm_api_token }}"
  loop: "{{ platform_repos | product(env_branch_map.values() | list) | list }}"
  loop_control:
    label: "{{ item.0.name }}@{{ item.1 }}:README.md"
