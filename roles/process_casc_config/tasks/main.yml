---
# process_casc_config — Process CasC YAML files from a cloned repository
#
# Folder layout only:
#   base/    — resources applied to ALL environments
#   <env>/   — environment-specific overrides merged on top of base
#
# Flat-root YAML is not supported. Repositories must contain base/.
#
# Merge strategy (driven by schemas/resource-types.yml):
#   - keyed: items matched by identity_field, recursively merged (hard uniqueness)
#   - raw: recursively merged mappings with env keys winning
#   - atomic: same-relative-path file replace, concat, exact-dict unique
#
# Required variables:
#   repo_clone_dir: path to the cloned repo
#   repo_scope:     scope suffix (e.g., platform, myorg01)
#   output_dir:     directory to write processed YAML files
#   env_filter:     target environment (e.g., dev, prd)

- name: "Ensure output directory exists"
  ansible.builtin.file:
    path: "{{ output_dir }}"
    state: directory
    mode: "0755"

- name: "Load resource-types metadata"
  ansible.builtin.include_vars:
    file: "{{ casc_resource_types_file }}"
    name: _resource_types_meta

- name: "Reject unsupported explicit deletion before processing"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/scripts/pipeline/casc_runtime.py"
      - validate-deletions
      - --root
      - "{{ repo_clone_dir }}"
      - --control-config
      - "{{ casc_control_config | default(control_dir ~ '/' ~ control_repo ~ '/config.yml') }}"
      - --caller-role
      - "{{ casc_caller_role | default('tenant') }}"
      - --resource-types
      - "{{ casc_resource_types_file }}"
  changed_when: false

- name: "Detect base/ directory"
  ansible.builtin.stat:
    path: "{{ repo_clone_dir }}/base"
  register: _base_dir

- name: "Require folder-based layout (base/ directory)"
  ansible.builtin.assert:
    that:
      - _base_dir.stat.exists
      - _base_dir.stat.isdir
    fail_msg: >-
      CasC desired-state repositories must use folder layout with a base/
      directory. Flat-root YAML is not supported. Missing: {{ repo_clone_dir }}/base

- name: "Merge desired state (keyed / raw / atomic)"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/scripts/pipeline/casc_runtime.py"
      - merge-desired-state
      - --root
      - "{{ repo_clone_dir }}"
      - --env
      - "{{ env_filter }}"
      - --resource-types
      - "{{ casc_resource_types_file }}"
      - --allowed-keys
      - "{{ playbook_dir }}/roles/process_casc_config/defaults/main.yml"
      - --output-dir
      - "{{ output_dir }}"
      - --repo-scope
      - "{{ repo_scope }}"
  register: _merge_result
  changed_when: false

- name: "Report processing results"
  ansible.builtin.debug:
    msg: >-
      Processed {{ repo_clone_dir | basename }}
      → layout: folder-based
      → scope: {{ repo_scope }}
      {{ '→ env: ' + env_filter if env_filter is defined else '' }}
      → {{ _merge_result.stdout }}
