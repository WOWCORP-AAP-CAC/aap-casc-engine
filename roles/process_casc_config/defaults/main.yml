---
# Allowed top-level YAML keys — must match schemas/resource-types.yml exceptions.
# Includes the 49 declarative collection dispatch vars plus two engine-side Hub
# RBAC extensions (hub_roles, hub_group_roles). Action keys remain unsupported.
casc_allowed_resource_keys:
  # Keyed (scalar identity)
  - aap_organizations
  - aap_user_accounts
  - gateway_authenticators
  - gateway_service_keys
  - gateway_role_definitions
  - controller_credential_types
  - controller_instances
  - controller_instance_groups
  - hub_namespaces
  - eda_credential_types
  # Raw settings
  - gateway_settings
  - controller_settings
  # Atomic (scoped/compound declarative — ROADMAP-001)
  - aap_teams
  - aap_applications
  - gateway_authenticator_maps
  - gateway_http_ports
  - gateway_service_clusters
  - gateway_service_nodes
  - gateway_services
  - gateway_routes
  - gateway_role_user_assignments
  - gateway_role_team_assignments
  - hub_collections
  - hub_roles
  - hub_group_roles
  - hub_ee_registries
  - hub_ee_repositories
  - hub_ee_images
  - hub_collection_remotes
  - hub_collection_repositories
  - controller_labels
  - controller_credentials
  - controller_credential_input_sources
  - controller_execution_environments
  - controller_notifications
  - controller_projects
  - controller_inventories
  - controller_inventory_sources
  - controller_hosts
  - controller_groups
  - controller_templates
  - controller_workflows
  - controller_schedules
  - controller_roles
  - eda_credentials
  - eda_credential_input_sources
  - eda_controller_tokens
  - eda_projects
  - eda_event_streams
  - eda_decision_environments
  - eda_rulebook_activations

casc_resource_types_file: "{{ playbook_dir }}/schemas/resource-types.yml"
