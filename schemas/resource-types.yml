---
# Declarative CasC resource catalog (ROADMAP-011 + ROADMAP-001).
#
# collection: exact pinned infra.aap_configuration release.
# Inventory: schemas/collection-dispatch-4.7.0.yml derived from
#   roles/dispatch/defaults/main.yml (53 unique active dispatcher vars).
#
# merge_mode:
#   keyed  — proven scalar identity; field overlay by identity_field
#   raw    — settings dictionaries
#   atomic — complete declarations; path replace + concat + exact-dict unique
#
# unsupported: action/imperative keys only (launch, bulk-create, sync).

collection:
  name: infra.aap_configuration
  version: "4.7.0"
  discovered_from: >-
    Validated nonproduction project/EE install via
    ansible-galaxy collection list infra.aap_configuration

defaults:
  value_type: list
  identity_field: name
  identity_scalar: true
  merge_mode: keyed
  naming_supported: true
  deletion_supported: false
  deletion_field: state
  deletion_values:
    - absent
  deletion_evidence: ""

exceptions:
  # --- Proven scalar identity (keyed) ---
  aap_organizations:
    merge_mode: keyed
    naming_supported: true
    identity_field: name
    identity_evidence: "gateway_organizations README Unique value: name"
  aap_user_accounts:
    merge_mode: keyed
    naming_supported: true
    identity_field: username
    identity_evidence: "gateway_users README Unique value: username"
  gateway_authenticators:
    merge_mode: keyed
    naming_supported: true
    identity_field: name
    identity_evidence: "gateway_authenticators README Unique value: name"
  gateway_service_keys:
    merge_mode: keyed
    naming_supported: true
    identity_field: name
    identity_evidence: "gateway_service_keys README Unique value: name"
  gateway_role_definitions:
    merge_mode: keyed
    naming_supported: true
    identity_field: name
    identity_evidence: "gateway_role_definitions README: name must be unique"
  controller_credential_types:
    merge_mode: keyed
    naming_supported: true
    identity_field: name
    identity_evidence: "controller_credential_types README: name lookup"
  controller_instances:
    merge_mode: keyed
    naming_supported: true
    identity_field: hostname
    identity_evidence: "controller_instances README: hostname required"
  controller_instance_groups:
    merge_mode: keyed
    naming_supported: true
    identity_field: name
    identity_evidence: "controller_instance_groups README: name lookup"
  hub_namespaces:
    merge_mode: keyed
    naming_supported: true
    identity_field: name
    identity_evidence: "hub_namespace README: name lookup"
  eda_credential_types:
    merge_mode: keyed
    naming_supported: true
    identity_field: name
    identity_evidence: "eda_credential_types role: name is the object key"

  # --- Raw settings ---
  gateway_settings:
    merge_mode: raw
    naming_supported: false
    value_type: raw
    identity_evidence: "raw settings dictionary; not list-keyed"
  controller_settings:
    merge_mode: raw
    naming_supported: false
    value_type: raw
    identity_evidence: "raw settings mapping (settings: {...}); not list-keyed"

  # --- Atomic (scoped/compound declarative) ---
  # Path replace + concat + exact-dict unique. naming_supported may use
  # identity_field for policy checks independently of merge matching.
  aap_teams:
    merge_mode: atomic
    naming_supported: true
    identity_field: name
    identity_evidence: "scoped name+organization; atomic overlay (ROADMAP-001)"
  aap_applications:
    merge_mode: atomic
    naming_supported: true
    identity_field: name
    identity_evidence: "scoped name+organization; atomic overlay (ROADMAP-001)"
  gateway_authenticator_maps:
    merge_mode: atomic
    naming_supported: true
    identity_field: name
    identity_evidence: "compound name+authenticator; atomic overlay (ROADMAP-001)"
  gateway_http_ports:
    merge_mode: atomic
    naming_supported: true
    identity_field: name
    identity_evidence: "compound uniqueness; atomic overlay (ROADMAP-001)"
  gateway_service_clusters:
    merge_mode: atomic
    naming_supported: true
    identity_field: name
    identity_evidence: "compound uniqueness; atomic overlay (ROADMAP-001)"
  gateway_service_nodes:
    merge_mode: atomic
    naming_supported: true
    identity_field: name
    identity_evidence: "compound uniqueness; atomic overlay (ROADMAP-001)"
  gateway_services:
    merge_mode: atomic
    naming_supported: true
    identity_field: name
    identity_evidence: "compound uniqueness; atomic overlay (ROADMAP-001)"
  gateway_routes:
    merge_mode: atomic
    naming_supported: true
    identity_field: name
    identity_evidence: "compound uniqueness; atomic overlay (ROADMAP-001)"
  gateway_role_user_assignments:
    merge_mode: atomic
    naming_supported: false
    identity_evidence: "compound RBAC assignment; atomic overlay (ROADMAP-001)"
  gateway_role_team_assignments:
    merge_mode: atomic
    naming_supported: false
    identity_evidence: "compound RBAC assignment; atomic overlay (ROADMAP-001)"
  hub_collections:
    merge_mode: atomic
    naming_supported: true
    identity_field: name
    identity_evidence: "compound namespace+name+version; naming uses scalar name (ROADMAP-001)"
  hub_roles:
    merge_mode: atomic
    naming_supported: true
    identity_field: name
    engine_extension: true
    identity_evidence: >-
      Engine-side Hub RBAC extension (not in collection dispatcher defaults);
      hub_role README requires scalar name
  hub_group_roles:
    merge_mode: atomic
    naming_supported: false
    engine_extension: true
    identity_evidence: >-
      Engine-side Hub RBAC extension (not in collection dispatcher defaults);
      compound groups+role_list; atomic overlay
  hub_ee_registries:
