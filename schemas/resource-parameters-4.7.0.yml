  controller_schedules:
    role: controller_schedules
    source: roles/controller_schedules/README.md
    description: An Ansible Role to create/update/remove Schedules on Ansible Controller.
    parameter_groups:
    - name: Schedule Variables
      parameters:
      - name: name
        type: str
        required: 'yes'
        default: '""'
        description: Name of Job Template
      - name: new_name
        type: str
        required: 'no'
        default: '""'
        description: Setting this option will change the existing name (looked up
          via the name field).
      - name: description
        type: str
        required: 'no'
        default: 'false'
        description: Description to use for the job template.
      - name: rrule
        type: str
        required: 'yes'
        default: '""'
        description: A value representing the schedules iCal recurrence rule. See
          the awx.awx.schedule plugin for help constructing this value
      - name: extra_data
        type: dict
        required: 'no'
        default: '{}'
        description: Extra vars for the job template. Only allowed if prompt on launch
      - name: inventory
        type: str
        required: 'no'
        default: '""'
        description: Inventory applied to job template, assuming the job template
          prompts for an inventory.
      - name: credentials
        type: list
        required: 'no'
        default: '""'
        description: List of credentials applied as a prompt, assuming job template
          prompts for credentials
      - name: scm_branch
        type: str
        required: 'no'
        default: Project default
        description: Branch to use in the job run. Project default used if not set.
          Only allowed if `allow_override` set to true on project
      - name: execution_environment
        type: str
        required: 'no'
        default: Job Template default
        description: Execution Environment applied as a prompt. Job Template default
          used if not set. Only allowed if `ask_execution_environment_on_launch` set
          to true on Job Template
      - name: forks
        type: str
        required: 'no'
        default: Job Template default
        description: Forks applied as a prompt. Job Template default used if not set.
          Only allowed if `ask_forks_on_launch` set to true on Job Template
      - name: instance_groups
        type: str
        required: 'no'
        default: Job Template default
        description: List of Instance Groups applied as a prompt. Job Template default
          used if not set. Only allowed if `ask_instance_groups_on_launch` set to
          true on Job Template
      - name: job_slice_count
        type: str
        required: 'no'
        default: Job Template default
        description: Job Slice Count to use in the job run. Job Template default used
          if not set. Only allowed if `ask_job_slice_count_on_launch` set to true
          on Job Template
      - name: labels
        type: list
        required: 'no'
        default: Job Template default
        description: List of labels to use in the job run. Job Template default used
          if not set. Only allowed if `ask_labels_on_launch` set to true on Job Template
      - name: timeout
        type: str
        required: 'no'
        default: Job Template default
        description: Timeout to use in the job run. Job Template default used if not
          set. Only allowed if `ask_timeout_on_launch` set to true on Job Template
      - name: job_type
        type: str
        required: 'no'
        default: Job template default
        description: The job type used for the job template.
      - name: job_tags
        type: str
        required: 'no'
        default: '""'
        description: Comma separated list of tags to apply to the job
      - name: skip_tags
        type: str
        required: 'no'
        default: '""'
        description: Comma separated list of tags to skip for the job
      - name: limit
        type: str
        required: 'no'
        default: '""'
        description: A host pattern to constrain the list of hosts managed or affected
          by the playbook
      - name: diff_mode
        type: bool
        required: 'no'
        default: Job template default
        description: Enable diff mode for the job template
      - name: verbosity
        type: int
        required: 'no'
        default: Job template default
        description: Level of verbosity for the job. Only allowed if configured to
          prompt on launch
      - name: unified_job_template
        type: string
        required: 'no'
        default: '""'
        description: The name of object that is being targeted by the schedule. Example
          objects include projects, inventory sources, and templates. Required if
          state='present.
      - name: organization
        type: str
        required: 'no'
        default: '""'
        description: The organization the unified job template exists in. Used for
          looking up the unified job template, not a direct model field.
      - name: enabled
        type: bool
        required: 'no'
        default: 'true'
        description: Enabled processing of this job template
      - name: state
        type: str
        required: 'no'
        default: present
        description: Desired state of the resource.
      - name: register
        type: str
        required: 'no'
        default: '""'
        description: Variable to set based on the result of the object creation/modification
