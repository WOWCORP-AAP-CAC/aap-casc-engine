      - name: organization
        type: str
        required: 'no'
        default: '""'
        description: The name of the organization.
      - name: eda_credentials
        type: list
        required: 'no'
        default: '""'
        description: A list of IDs for EDA credentials used by the rulebook activation.
      - name: k8s_service_name
        type: str
        required: 'no'
        default: '""'
        description: The name of the Kubernetes service associated with this rulebook
          activation.
      - name: swap_single_source
        type: bool
        required: 'no'
        default: '"true"'
        description: Allow swapping of single sources in a rulebook without name match.
      - name: event_streams
        type: list
        required: 'no'
        default: '""'
        description: A list of dicts defining event streams for this rulebook activation.
          Each dict requires `event_stream` (str, the event stream name) and one of
          `source_name` (str) or `source_index` (int) to identify the source. `source_name`
          and `source_index` are mutually exclusive. See the YAML example below.
      - name: log_level
        type: str
        required: 'no'
        default: '""'
        description: Allow setting the desired log level.
