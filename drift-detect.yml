---
# AAP Multi-Tenant CasC Engine — Drift Detection (report-only)
#
# Clones the control repo, reads config.yml + tenants.yml, clones desired-state
# repos, merges YAML, and compares declared identities against live AAP via
# exact API queries (ROADMAP-002 identity_presence).
#
# Undeclared live objects are ignored. Apply convergence by launching the
# Dispatcher Job Template — Drift does not remediate.
#
# Usage:
#   ansible-playbook drift-detect.yml -e target_env=poc

- name: "AAP Multi-Tenant CasC Engine — Drift Detection (report-only)"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    aap_hostname: "{{ lookup('env', 'CONTROLLER_HOST') }}"
    aap_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
    aap_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
    aap_oauth_token: "{{ lookup('env', 'CONTROLLER_OAUTH_TOKEN') }}"
    aap_validate_certs: "{{ lookup('env', 'CONTROLLER_VERIFY_SSL') | default(true, true) | bool }}"
    target_env: "{{ lookup('env', 'TARGET_ENV') }}"
    drift_report_path: "{{ lookup('env', 'DRIFT_REPORT_PATH') | default('/tmp/drift-report.json', true) }}"
    scm_base_url: "{{ lookup('env', 'SCM_BASE_URL') }}"
    scm_token: "{{ lookup('env', 'SCM_TOKEN') }}"

    control_scm_org: "{{ lookup('env', 'CONTROL_SCM_ORG') | default(lookup('env', 'PLATFORM_SCM_ORG'), true) }}"
    control_repo: "{{ lookup('env', 'CONTROL_REPO') | default('casc-platform-control', true) }}"
    control_branch: "{{ lookup('env', 'CONTROL_BRANCH') | default('main', true) }}"
    control_revision: "{{ lookup('env', 'CONTROL_REVISION') | default('', true) }}"
    platform_scm_org: "{{ lookup('env', 'PLATFORM_SCM_ORG') | default('', true) }}"
    control_dir: "/tmp/casc-control"
    drift_desired_path: "/tmp/drift-desired.json"

  tasks:
    - name: "Clone control repo"
      ansible.builtin.include_role:
        name: git_clone_repos
      vars:
        repos_to_clone:
          - name: "{{ control_repo }}"
            scm_org: "{{ control_scm_org }}"
            aap_scope: control
        clone_base_dir: "{{ control_dir }}"
        clone_branch: "{{ control_branch }}"
        clone_depth: 0
        git_base_url: "{{ scm_base_url }}"
        git_token: "{{ scm_token }}"

    - name: "Pin control repo to authoritative revision when supplied"
      ansible.builtin.command:
        cmd: "git -C {{ control_dir }}/{{ control_repo }} checkout --detach {{ control_revision }}"
      when: control_revision | length > 0
      changed_when: false

    - name: "Resolve effective control revision"
      ansible.builtin.command:
        cmd: "git -C {{ control_dir }}/{{ control_repo }} rev-parse HEAD"
      register: _control_rev_probe
      changed_when: false

    - name: "Record effective control revision"
      ansible.builtin.set_fact:
        effective_control_revision: "{{ _control_rev_probe.stdout }}"

    - name: "Fail closed when requested control revision is unavailable"
      ansible.builtin.assert:
        that:
          - effective_control_revision | length > 0
          - control_revision | length == 0 or _control_rev_probe.stdout == control_revision
        fail_msg: >-
          Authoritative control revision is unavailable or mismatched.
          requested={{ control_revision }} resolved={{ effective_control_revision }}

    - name: "Load config.yml from control repo"
      ansible.builtin.include_vars:
        file: "{{ control_dir }}/{{ control_repo }}/config.yml"
        name: control_config

    - name: "Load tenants.yml from control repo"
      ansible.builtin.include_vars:
        file: "{{ control_dir }}/{{ control_repo }}/tenants.yml"
        name: tenants_registry

    - name: "Compute effective configuration from control metadata"
      ansible.builtin.set_fact:
        platform_scm_org: "{{ control_config.platform_scm_org }}"
        _platform_repo: "{{ control_config.platform_repo | default('casc-platform-global') }}"

    - name: "Validate and normalize the tenant registry"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/scripts/pipeline/casc_runtime.py"
          - validate-registry
          - --config
          - "{{ control_dir }}/{{ control_repo }}/config.yml"
          - --tenants
          - "{{ control_dir }}/{{ control_repo }}/tenants.yml"
      register: _tenant_registry_validation
      changed_when: false

    - name: "Record normalized tenant runtime data"
      ansible.builtin.set_fact:
        _normalized_tenants: "{{ (_tenant_registry_validation.stdout | from_json).tenants }}"

    - name: "Assert target_env is defined in env_branch_map"
      ansible.builtin.assert:
        that:
          - target_env in control_config.env_branch_map
        fail_msg: >-
          target_env '{{ target_env }}' not found in control config.yml env_branch_map.
          Valid environments: {{ control_config.env_branch_map.keys() | list }}.

    - name: "Resolve target branch"
      ansible.builtin.set_fact:
        target_branch: "{{ control_config.env_branch_map[target_env] }}"

    - name: "Filter active tenants"
      ansible.builtin.set_fact:
        _active_tenants: "{{ _normalized_tenants | selectattr('status', 'equalto', 'active') | selectattr('dispatch_enabled', 'equalto', true) | list }}"

    - name: "Build platform repos list for drift check"
      ansible.builtin.set_fact:
        _platform_repos:
          - name: "{{ _platform_repo }}"
            clone_name: "platform__{{ _platform_repo }}"
            aap_scope: platform
            scm_org: "{{ platform_scm_org }}"

    - name: "Initialize tenant repos list for drift check"
      ansible.builtin.set_fact:
        _tenant_repos: []

    - name: "Build tenant repos list from the canonical registry resolver"
      ansible.builtin.set_fact:
        _tenant_repos: "{{ _tenant_repos + [{'name': item.repository, 'clone_name': item.tenant_id + '__' + item.repository, 'aap_scope': item.tenant_id, 'scm_org': item.tenant_scm_org}] }}"
      loop: "{{ _active_tenants }}"
      loop_control:
        label: "{{ item.tenant_id }} -> {{ item.repository }}"

    - name: "Combine all repos for processing"
      ansible.builtin.set_fact:
        _all_repos: "{{ _platform_repos + _tenant_repos }}"

    - name: "Clone platform CasC repos at target branch"
      ansible.builtin.include_role:
        name: git_clone_repos
      vars:
        repos_to_clone: "{{ _platform_repos }}"
        clone_base_dir: "/tmp/drift-repos"
        clone_branch: "{{ target_branch }}"
        clone_depth: 0
        git_base_url: "{{ scm_base_url }}"
        git_token: "{{ scm_token }}"

    - name: "Clone tenant CasC repos at target branch"
      ansible.builtin.include_role:
        name: git_clone_repos
      vars:
        repos_to_clone: "{{ _tenant_repos }}"
        clone_base_dir: "/tmp/drift-repos"
        clone_branch: "{{ target_branch }}"
        clone_depth: 0
        git_base_url: "{{ scm_base_url }}"
        git_token: "{{ scm_token }}"

    - name: "Process YAML for each repo (folder-based env layering)"
      ansible.builtin.include_role:
        name: process_casc_config
      vars:
        repo_clone_dir: "/tmp/drift-repos/{{ casc_repo.clone_name | default(casc_repo.name) }}"
        repo_scope: "{{ casc_repo.aap_scope }}"
        output_dir: "/tmp/drift-staging"
        env_filter: "{{ target_env }}"
      loop: "{{ _all_repos }}"
      loop_control:
        loop_var: casc_repo
        label: "{{ casc_repo.name }}"

    - name: "Load processed config (scope-suffixed)"
      ansible.builtin.include_vars:
        dir: "/tmp/drift-staging"
        extensions: [yml, yaml]
        depth: 1

    - name: "Merge suffixed variables into standard dispatch variables"
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
        tasks_from: include_wildcard_vars.yml

    - name: "Merge scope-suffixed Hub RBAC vars (engine-side)"
      ansible.builtin.set_fact:
        "{{ item }}": >-
          {{ query('ansible.builtin.varnames', '^' + item + '_.*')
             | reject('match', '.*_secure_logging$')
             | map('extract', vars) | flatten }}
      loop: [hub_roles, hub_group_roles]
      when: query('ansible.builtin.varnames', '^' + item + '_.*') | length > 0

    - name: "Stage declared desired state for identity_presence compare"
      ansible.builtin.copy:
        dest: "{{ drift_desired_path }}"
        content: "{{ {
          'aap_organizations': aap_organizations | default([]),
          'aap_teams': aap_teams | default([]),
          'controller_credential_types': controller_credential_types | default([]),
          'controller_projects': controller_projects | default([]),
          'controller_inventories': controller_inventories | default([])
        } | to_nice_json }}"
      delegate_to: localhost

    - name: "Compare declared identities against live AAP (report-only)"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/scripts/pipeline/drift_compare.py"
          - --desired
          - "{{ drift_desired_path }}"
          - --report
          - "{{ drift_report_path }}"
      environment:
        CONTROLLER_HOST: "{{ aap_hostname }}"
        CONTROLLER_OAUTH_TOKEN: "{{ aap_oauth_token | default('', true) }}"
        CONTROLLER_USERNAME: "{{ aap_username | default('', true) }}"
        CONTROLLER_PASSWORD: "{{ aap_password | default('', true) }}"
        CONTROLLER_VERIFY_SSL: "{{ aap_validate_certs | string }}"
        TARGET_ENV: "{{ target_env }}"
        CONTROL_REVISION: "{{ effective_control_revision }}"
      register: _drift_compare
      changed_when: false
      no_log: true

    - name: "Load drift report"
      ansible.builtin.slurp:
        src: "{{ drift_report_path }}"
      register: _drift_report_slurp

    - name: "Parse drift report"
      ansible.builtin.set_fact:
        drift_report: "{{ _drift_report_slurp.content | b64decode | from_json }}"

    - name: "Display drift summary"
      ansible.builtin.debug:
        msg: |
          ══════════════════════════════════════════════════════
          DRIFT DETECTION REPORT — {{ target_env | upper }} (schema v2)
          ══════════════════════════════════════════════════════
          Timestamp: {{ drift_report.timestamp }}
          AAP Host:  {{ drift_report.aap_host }}
          Control:   {{ drift_report.control_revision }}
          Drift Detected: {{ drift_report.drift_detected }}
          Missing declared identities: {{ drift_report.summary.missing_in_live }}
          ──────────────────────────────────────────────────────
          Organizations missing: {{ drift_report.details.aap_organizations.missing_in_live | map(attribute='identity') | list }}
          Teams missing: {{ drift_report.details.aap_teams.missing_in_live | map(attribute='identity') | list }}
          Credential types missing: {{ drift_report.details.controller_credential_types.missing_in_live | map(attribute='identity') | list }}
          Projects missing: {{ drift_report.details.controller_projects.missing_in_live | map(attribute='identity') | list }}
          Inventories missing: {{ drift_report.details.controller_inventories.missing_in_live | map(attribute='identity') | list }}
          ══════════════════════════════════════════════════════
          Undeclared live objects are ignored. To apply declared state,
          launch jt-platform-casc_dispatcher (serialized Dispatcher).

    - name: "Publish drift report as job artifact"
      ansible.builtin.set_stats:
        data:
          drift_report: "{{ drift_report }}"

    - name: "Send drift notification"
      ansible.builtin.uri:
        url: "{{ notification_webhook_url }}"
        method: POST
        body_format: json
        body:
          text: "CasC Drift Report [{{ target_env | upper }}]: Drift {{ 'DETECTED' if drift_report.drift_detected else 'CLEAR' }} — {{ aap_hostname }}"
          drift_report: "{{ drift_report }}"
      when:
        - notification_webhook_url is defined
        - drift_report.drift_detected | bool
